name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: कक्षाएँ इंस्टॉल करें
        run: npm ci

      - name: लिंट
        run: npm run lint

      - name: टाइप जाँच
        run: npm run typecheck

      - name: इकाई परीक्षण (+ कवरेज)
        run: npm run test:coverage

      - name: सामग्री की जाँच
        run: npm run check:content

      - name: बिल्ड
        run: npm run build
